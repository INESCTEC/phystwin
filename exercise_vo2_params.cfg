# ═══════════════════════════════════════════════════════════════════════════════
# exercise_vo2_params.cfg  — [V4] parametros de VO2 para Intensity = %VO2R
#
# Este ficheiro e lido em tempo de execucao por:
#   - libBiogears/src/engine/Systems/Energy.cpp   (Energy::Exercise)
#   - libBiogears/src/engine/Systems/Nervous.cpp  (CentralSignalProcess + ElastanceFF)
#
# O loader procura este ficheiro no cwd do executavel. Se NAO encontrar, o engine
# fara fallback analitico via patient state:
#   vo2_rest_L_per_min  :  3.5 mL/kg/min × weight   (1 MET convencional)
#   vo2_max_L_per_min   :  4.2 − 0.032 × age        (Jones NL 1985, ergometer, masc)
#   efficiency          :  0.21                      (cycling, Poole & Jones 2012)
#
# Para personalizacao (digital-twin), edite os valores abaixo com dados do
# sujeito (ex: CPET real, VO2max medido, etc.) e coloque este ficheiro ao
# lado do binario do BioGears.
#
# Formato: uma chave=valor por linha, sem espaços, linhas # sao comentarios.
# ═══════════════════════════════════════════════════════════════════════════════

# Std Male 44 yr, 77 kg (coorte-base da tese, Christie 1987 age-scaled)
# VO2_rest = 3.5 × 77 / 1000 = 0.270  L/min
# VO2_max  = 4.2 − 0.032 × 44 = 2.792 L/min  (Jones 1985)
vo2_rest_L_per_min=0.270
vo2_max_L_per_min=2.792
efficiency=0.21

# ─────────────────────────────────────────────────────────────────────────────
# Mapping esperado para o protocolo de Christie 1987 (age-scaled para 44 yr):
#
#   Christie %VO2max  |  Intensity (%VO2R)   |  ΔMetabolic_W  |  workRate_mech_W
#   ─────────────────────────────────────────────────────────────────────────
#        40 %         |      ~0.33           |    ~293         |    ~62
#        60 %         |      ~0.52           |    ~462         |    ~97
#        80 %         |      ~0.71           |    ~631         |   ~132
#       100 %         |      ~0.90           |    ~800         |   ~168
#
#   (conversoes: %VO2R = (0.4×VO2max − VO2rest) / (VO2max − VO2rest), com
#    VO2rest=0.27, VO2max=2.79. Para exercicio acima de VO2rest, %VO2R < %VO2max.)
#
# Referencias:
#   Jones NL et al. Am Rev Respir Dis 1985; 131:700-708.
#   Weir JBdV. J Physiol 1949; 109:1-9.
#   Hansen JE, Wasserman K. Am Rev Respir Dis 1984.
#   Swain DP, Leutholtz BC. Med Sci Sports Exerc 1997; 29:410-414.
#   Poole DC, Jones AM. Compr Physiol 2012; 2:933-996.
# ─────────────────────────────────────────────────────────────────────────────
